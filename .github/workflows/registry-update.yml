name: Publish jk to joker-registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v2.3.0）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: Joker-Principal/joker-registry/.github/workflows/update-port.yml@master
    with:
      port: jk
      tag: ${{ inputs.tag }}
    secrets:
      registry-token: ${{ secrets.JOKER_REGISTRY_AUTO_UPDATE }}
